; Firmware del dispositivo Braille (ESP32 DevKit, 36 pines).
; Cumple docs/PROTOCOLO.md, versión 1.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    madhephaestus/ESP32Servo@^3.2.1

; Monitor serie para probar el protocolo a mano: se escribe una línea JSON y se envía con Enter.
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter
