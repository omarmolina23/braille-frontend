# Actualizaciones semanales hacia develop (docs/metodologia/ci-cd.md).
# Las versiones mayores llegan como PR propios: no se mezclan con otros cambios.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: 'ci(deps)'
