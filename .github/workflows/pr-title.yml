name: Título del PR

# El título del PR es el commit que queda en develop (squash merge).
# pull_request y no pull_request_target: GitHub toma este último de la rama por defecto (main),
# no de la base del PR. Aquí solo se lee el título; no se ejecuta código del PR.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            refactor
            docs
            chore
            ci
            perf
          # Alcances de docs/metodologia/flujo-de-trabajo.md; la lista es la misma en los dos repos.
          scopes: |
            dispositivo
            lectura
            escritura
            narracion
            progreso
            usuarios
            dominio
            api
            ui
            ci
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'La descripción del título debe empezar en minúscula (por ejemplo, "feat(lectura): ejercicio de la serie 1 (RF-06)").'
