name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Los pasos se activan solos cuando exista firmware/platformio.ini (ver firmware/README.md).
  firmware:
    name: Compilar firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('firmware/platformio.ini') != '' }}
        with:
          python-version: '3.12'
      - run: pip install platformio
        if: ${{ hashFiles('firmware/platformio.ini') != '' }}
      - run: pio run
        if: ${{ hashFiles('firmware/platformio.ini') != '' }}
        working-directory: firmware
